get_history:
  fields:
    limit:
      default: 30
      selector:
        number: {min: 1, max: 200}
    refresh:
      default: false
      selector:
        boolean: {}
    profile:
      selector:
        text: {}
    service:
      default: netflix
      selector:
        select:
          options: [netflix, disney]
    kind:
      default: history
      selector:
        select:
          options: [history, continue]
get_episodes:
  name: Get episodes
  description: Seasons and episodes of a Netflix show for a profile, with where that profile is up to.
  fields:
    id:
      name: Netflix title ID
      required: true
      selector:
        text:
    profile:
      name: Profile
      selector:
        text:
