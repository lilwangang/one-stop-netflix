get_history:
  fields:
    limit:
      default: 30
      selector:
        number: {min: 1, max: 200}
    refresh:
      default: false
      selector:
        boolean: {}
    profile:
      selector:
        text: {}
    service:
      default: netflix
      selector:
        select:
          options: [netflix, disney]
    kind:
      default: history
      selector:
        select:
          options: [history, continue]
